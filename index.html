<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMe — Онлайн запись</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #7C3AED;
  --primary-light: #EDE9FE;
  --primary-dark: #5B21B6;
  --primary-mid: #8B5CF6;
  --white: #ffffff;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-600: #4B5563;
  --gray-700: #374151;
  --gray-900: #111827;
  --green: #059669;
  --green-light: #D1FAE5;
  --yellow: #D97706;
  --yellow-light: #FEF3C7;
  --red: #DC2626;
  --red-light: #FEE2E2;
  --shadow: 0 4px 20px rgba(124,58,237,0.10);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
  --radius: 18px;
  --radius-sm: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--gray-50);
  color: var(--gray-900);
  min-height: 100vh;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }

/* HEADER */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 0 28px; height: 66px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 21px; font-weight: 800; color: var(--primary);
}
.logo-box {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--primary), var(--primary-mid));
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.header-pill {
  background: var(--primary-light); color: var(--primary);
  padding: 5px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 700;
}

/* LAYOUT */
.app {
  max-width: 1280px; margin: 0 auto;
  padding: 32px 28px;
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 28px; align-items: start;
}

/* CARD */
.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-100);
  overflow: hidden;
}
.card-header {
  padding: 20px 24px 18px;
  border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; gap: 10px;
}
.card-header h2 { font-size: 16px; font-weight: 700; }
.card-icon {
  width: 34px; height: 34px;
  background: var(--primary-light); border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
}
.card-body { padding: 22px 24px; }

/* CALENDAR */
.cal-top {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 18px;
}
.cal-top h3 { font-size: 15px; font-weight: 700; text-transform: capitalize; }
.cal-arrow {
  width: 32px; height: 32px;
  border: 1.5px solid var(--gray-200); border-radius: 8px;
  background: var(--white); cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gray-700); transition: all .18s;
}
.cal-arrow:hover {
  background: var(--primary-light);
  border-color: var(--primary); color: var(--primary);
}
.wdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
.wday {
  text-align: center; font-size: 11px; font-weight: 700;
  color: var(--gray-400); padding: 4px 0;
  letter-spacing: .5px; text-transform: uppercase;
}
.days { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 9px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s;
  border: 1.5px solid transparent;
  color: var(--gray-700); position: relative; user-select: none;
}
.day:hover:not(.empty):not(.past) {
  background: var(--primary-light); color: var(--primary);
}
.day.today { border-color: var(--primary); color: var(--primary); font-weight: 700; }
.day.selected {
  background: var(--primary); color: #fff;
  border-color: var(--primary); font-weight: 700;
  box-shadow: 0 2px 10px rgba(124,58,237,.35);
}
.day.past { color: var(--gray-300); cursor: not-allowed; }
.day.empty { cursor: default; }
.day.has-dot::after {
  content: ''; position: absolute; bottom: 3px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--primary-mid);
}
.day.selected.has-dot::after { background: rgba(255,255,255,.7); }

/* SLOTS */
.slots-section { margin-top: 22px; }
.slots-top {
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 10px;
}
.slots-title {
  font-size: 12px; font-weight: 700;
  color: var(--gray-500); text-transform: uppercase; letter-spacing: .6px;
}
.dur-tabs { display: flex; gap: 5px; }
.dur-tab {
  padding: 4px 12px; border-radius: 20px;
  border: 1.5px solid var(--gray-200);
  background: var(--white); font-size: 12px; font-weight: 600;
  cursor: pointer; color: var(--gray-500); transition: all .15s;
}
.dur-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.slots-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 7px;
}
.slot {
  padding: 9px 0; text-align: center; border-radius: 9px;
  border: 1.5px solid var(--gray-200); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s;
  color: var(--gray-700); background: var(--white); user-select: none;
}
.slot:hover:not(.taken) {
  border-color: var(--primary); color: var(--primary); background: var(--primary-light);
}
.slot.chosen {
  background: var(--primary); color: #fff;
  border-color: var(--primary); box-shadow: 0 2px 8px rgba(124,58,237,.3);
}
.slot.taken {
  background: var(--gray-100); color: var(--gray-300);
  cursor: not-allowed; text-decoration: line-through;
}
.no-date-msg {
  text-align: center; padding: 20px 0;
  color: var(--gray-400); font-size: 13px;
}

/* FORM */
.info-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; margin-bottom: 18px;
}
.info-bar.empty { background: var(--gray-100); color: var(--gray-400); }
.info-bar.filled { background: var(--primary-light); color: var(--primary-dark); }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgroup { margin-bottom: 14px; }
.flabel {
  display: block; font-size: 12px; font-weight: 700;
  color: var(--gray-600); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: .4px;
}
.flabel em { color: var(--primary); font-style: normal; }
.finput, .fselect {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--gray-900);
  background: var(--white); transition: all .18s;
  font-family: inherit; outline: none; appearance: none;
}
.finput:focus, .fselect:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(124,58,237,.10);
}
.finput::placeholder { color: var(--gray-400); }
.finput.err, .fselect.err { border-color: var(--red); }

.btn-book {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--primary), var(--primary-mid));
  color: #fff; border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all .22s; font-family: inherit;
}
.btn-book:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(124,58,237,.38);
}
.btn-book:active:not(:disabled) { transform: translateY(0); }
.btn-book:disabled { opacity: .45; cursor: not-allowed; }

/* RIGHT COLUMN */
.right { display: flex; flex-direction: column; gap: 22px; }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.stat {
  background: var(--white); border-radius: var(--radius);
  padding: 18px 16px; text-align: center;
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
  transition: transform .2s, box-shadow .2s;
}
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-n { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.stat-l { font-size: 12px; color: var(--gray-400); font-weight: 500; }

/* TOOLBAR */
.bk-toolbar { padding: 0 24px 14px; display: flex; flex-direction: column; gap: 10px; }
.bk-search { position: relative; }
.bk-search input {
  width: 100%; padding: 9px 13px 9px 36px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
  font-size: 13px; outline: none; font-family: inherit;
  background: var(--gray-50); color: var(--gray-900); transition: all .18s;
}
.bk-search input:focus { border-color: var(--primary); background: #fff; }
.bk-search-ic {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); color: var(--gray-400);
  font-size: 14px; pointer-events: none;
}
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fil {
  padding: 5px 14px; border-radius: 20px;
  border: 1.5px solid var(--gray-200); background: var(--white);
  font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--gray-500); transition: all .15s;
}
.fil.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.sort-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--gray-400);
}
.sort-row select {
  padding: 4px 8px; border-radius: 7px;
  border: 1.5px solid var(--gray-200); font-size: 12px;
  font-family: inherit; outline: none;
  background: var(--white); color: var(--gray-700); cursor: pointer;
}
.sort-row select:focus { border-color: var(--primary); }

/* BOOKING LIST */
.bk-list {
  padding: 0 24px 24px;
  max-height: 540px; overflow-y: auto;
}
.bk-list::-webkit-scrollbar { width: 4px; }
.bk-list::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 2px; }

/* BOOKING CARD */
.bk-card {
  display: flex; align-items: flex-start; gap: 13px;
  padding: 15px; border: 1.5px solid var(--gray-100);
  border-radius: var(--radius-sm); margin-bottom: 9px;
  transition: all .2s; background: var(--white);
  animation: fadeUp .28s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(-6px); }
  to   { opacity:1; transform:translateY(0); }
}
.bk-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow); }
.bk-card.removing {
  animation: slideOut .3s ease forwards;
}
@keyframes slideOut {
  to { opacity:0; transform:translateX(20px); max-height:0; padding:0; margin:0; border:none; overflow:hidden; }
}

.date-pill {
  background: linear-gradient(135deg, var(--primary), var(--primary-mid));
  color: #fff; border-radius: 10px; padding: 8px 12px;
  text-align: center; min-width: 52px; flex-shrink: 0;
}
.date-pill .dp-d { font-size: 20px; font-weight: 800; line-height: 1; }
.date-pill .dp-m { font-size: 10px; opacity: .85; margin-top: 2px; }

.bk-body { flex: 1; min-width: 0; }
.bk-name {
  font-size: 15px; font-weight: 700; color: var(--gray-900);
  margin-bottom: 4px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.bk-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.bk-meta span {
  font-size: 12px; color: var(--gray-500);
  display: flex; align-items: center; gap: 3px;
}
.bk-comment {
  font-size: 12px; color: var(--gray-400); font-style: italic;
  margin-bottom: 8px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.bk-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* BADGE */
.badge {
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.badge-confirmed { background: var(--green-light); color: var(--green); }
.badge-pending   { background: var(--yellow-light); color: var(--yellow); }
.badge-cancelled { background: var(--red-light); color: var(--red); }

.status-sel {
  padding: 4px 8px; border-radius: 20px;
  border: 1.5px solid var(--gray-200); font-size: 11px;
  font-weight: 600; cursor: pointer; outline: none;
  font-family: inherit; background: var(--white);
  color: var(--gray-700); transition: border-color .15s;
}
.status-sel:focus { border-color: var(--primary); }

.btn-del {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1.5px solid var(--gray-200); background: var(--white);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; color: var(--gray-400);
  margin-left: auto; flex-shrink: 0;
}
.btn-del:hover { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* EMPTY */
.empty { text-align: center; padding: 52px 20px; color: var(--gray-400); }
.empty-ic { font-size: 52px; margin-bottom: 12px; }
.empty h3 { font-size: 16px; font-weight: 700; color: var(--gray-500); margin-bottom: 6px; }
.empty p { font-size: 13px; }

/* TOAST */
#toastArea {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 13px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 600; color: #fff;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  display: flex; align-items: center; gap: 9px;
  animation: toastIn .3s ease; max-width: 310px;
}
@keyframes toastIn {
  from { opacity:0; transform:translateY(10px) scale(.96); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.toast.success { background: #065F46; }
.toast.error   { background: #991B1B; }
.toast.info    { background: var(--primary-dark); }

/* MODAL */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.42);
  z-index: 500; display: flex; align-items: center;
  justify-content: center; padding: 20px; animation: ovIn .2s;
}
@keyframes ovIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--white); border-radius: var(--radius);
  padding: 30px; max-width: 370px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.22); animation: mdIn .22s ease;
}
@keyframes mdIn {
  from { opacity:0; transform:scale(.93) translateY(8px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.modal p  { font-size: 14px; color: var(--gray-500); margin-bottom: 24px; }
.modal-btns { display: flex; gap: 10px; }
.btn-mcancel {
  flex:1; padding: 11px; border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm); background: var(--white);
  cursor: pointer; font-size: 14px; font-weight: 600;
  font-family: inherit; color: var(--gray-700); transition: all .15s;
}
.btn-mcancel:hover { border-color: var(--gray-400); }
.btn-mdelete {
  flex:1; padding: 11px; border: none;
  border-radius: var(--radius-sm); background: var(--red);
  cursor: pointer; font-size: 14px; font-weight: 700;
  font-family: inherit; color: #fff; transition: background .15s;
}
.btn-mdelete:hover { background: #B91C1C; }

/* RESPONSIVE */
@media(max-width:960px) {
  .app { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2,1fr); }
}
@media(max-width:520px) {
  .app { padding: 14px; }
  .header-inner { padding: 0 16px; }
  .slots-grid { grid-template-columns: repeat(3,1fr); }
  .frow { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<div id="toastArea"></div>
<div id="overlayWrap"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-box">📅</div>
      BookMe
    </div>
    <div class="header-pill" id="hPill">0 записей</div>
  </div>
</header>

<!-- APP -->
<div class="app">

  <!-- ══ LEFT ══ -->
  <div style="display:flex;flex-direction:column;gap:22px">

    <!-- CALENDAR -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">🗓️</div>
        <h2>Выберите дату</h2>
      </div>
      <div class="card-body">
        <div class="cal-top">
          <button class="cal-arrow" id="btnPrev">‹</button>
          <h3 id="calTitle"></h3>
          <button class="cal-arrow" id="btnNext">›</button>
        </div>
        <div class="wdays" id="wdays"></div>
        <div class="days" id="calDays"></div>

        <div class="slots-section">
          <div class="slots-top">
            <div class="slots-title">Доступное время</div>
            <div class="dur-tabs" id="durTabs">
              <button class="dur-tab active" data-dur="30">30 мин</button>
              <button class="dur-tab" data-dur="60">60 мин</button>
            </div>
          </div>
          <div id="slotsWrap"></div>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">✍️</div>
        <h2>Данные клиента</h2>
      </div>
      <div class="card-body">
        <div class="info-bar empty" id="infoBar">
          <span>📌</span>
          <span id="infoText">Сначала выберите дату и время</span>
        </div>
        <div class="frow">
          <div class="fgroup">
            <label class="flabel">Имя <em>*</em></label>
            <input class="finput" id="iName" placeholder="Анна Иванова" maxlength="50">
          </div>
          <div class="fgroup">
            <label class="flabel">Телефон <em>*</em></label>
            <input class="finput" id="iPhone" placeholder="+7 (999) 000-00-00" maxlength="18">
          </div>
        </div>
        <div class="fgroup">
          <label class="flabel">Услуга <em>*</em></label>
          <select class="fselect" id="iService">
            <option value="">— Выберите услугу —</option>
            <optgroup label="💅 Маникюр">
              <option>Классический маникюр</option>
              <option>Аппаратный маникюр</option>
              <option>Гель-лак</option>
              <option>Наращивание ногтей</option>
              <option>Дизайн ногтей</option>
            </optgroup>
            <optgroup label="🦶 Педикюр">
              <option>Классический педикюр</option>
              <option>Аппаратный педикюр</option>
              <option>СПА-педикюр</option>
            </optgroup>
            <optgroup label="✨ Комплекс">
              <option>Маникюр + Педикюр</option>
              <option>Маникюр + Покрытие</option>
            </optgroup>
            <optgroup label="💆 Уход">
              <option>Парафинотерапия</option>
              <option>Укрепление ногтей</option>
            </optgroup>
          </select>
        </div>
        <div class="fgroup">
          <label class="flabel">Комментарий</label>
          <input class="finput" id="iComment" placeholder="Пожелания или аллергии…" maxlength="120">
        </div>
        <button class="btn-book" id="btnBook">Записаться</button>
      </div>
    </div>
  </div>

  <!-- ══ RIGHT ══ -->
  <div class="right">

    <!-- STATS -->
    <div class="stats">
      <div class="stat">
        <div class="stat-n" id="sAll" style="color:var(--primary)">0</div>
        <div class="stat-l">Всего</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="sCon" style="color:var(--green)">0</div>
        <div class="stat-l">Подтверждено</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="sPen" style="color:var(--yellow)">0</div>
        <div class="stat-l">Ожидает</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="sCan" style="color:var(--red)">0</div>
        <div class="stat-l">Отменено</div>
      </div>
    </div>

    <!-- BOOKINGS -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon">📋</div>
        <h2>Все записи</h2>
      </div>

      <div class="bk-toolbar">
        <div class="bk-search">
          <span class="bk-search-ic">🔍</span>
          <input type="text" id="searchInput" placeholder="Поиск по имени, услуге, телефону…">
        </div>
        <div class="filters" id="filters">
          <button class="fil active" data-f="all">Все</button>
          <button class="fil" data-f="pending">Ожидает</button>
          <button class="fil" data-f="confirmed">Подтверждено</button>
          <button class="fil" data-f="cancelled">Отменено</button>
        </div>
        <div class="sort-row">
          <span>Сортировка:</span>
          <select id="sortSel">
